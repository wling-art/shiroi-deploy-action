name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow]

permissions: write-all

env:
  HASH_FILE: build_hash

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}
    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read HASH_FILE content
        id: read_hash
        run: |
          content=$(cat ${{ env.HASH_FILE }} 2>/dev/null || echo "")
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: innei-dev/Yohaku
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Check if rebuild is needed
        id: check
        env:
          FILE_HASH: ${{ steps.read_hash.outputs.hash_content }}
        run: |
          current_hash=$(git rev-parse --short HEAD)
          if [ "$FILE_HASH" == "$current_hash" ]; then
            echo "Build cache is valid, skipping rebuild"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build cache is stale, proceeding with rebuild"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: innei-dev/Yohaku
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      # `vercel deploy` uploads files instead of cloning, so the build machine
      # has no `.git` and the repo's postinstall (which flattens the chained
      # `packages/* -> yohaku-oss/…` symlinks) bails out. Turbopack cannot
      # resolve a package through a symlink-to-a-symlink, so materialize them
      # here instead.
      - name: Materialize symlinked workspace packages
        run: |
          for link in packages/*; do
            [ -L "$link" ] || continue
            real=$(readlink -f "$link")
            rm "$link"
            cp -rL "$real" "$link"
            echo "materialized $link <- $real"
          done

      - name: Patch sources for Vercel
        run: |
          node - <<'EOF'
          const fs = require('fs')

          const patchFile = (file, edits) => {
            let code = fs.readFileSync(file, 'utf8')
            for (const [from, to] of edits) {
              const hit = from instanceof RegExp ? from.test(code) : code.includes(from)
              if (!hit) throw new Error(file + ': patch target missing: ' + from)
              code = code.replace(from, to)
            }
            fs.writeFileSync(file, code)
            console.log('patched ' + file)
          }

          // Edge + ISR does not survive on Vercel; run it as a plain dynamic
          // Node route instead.
          patchFile('apps/web/src/app/home-og/route.tsx', [
            ["export const runtime = 'edge'\n", "export const dynamic = 'force-dynamic'\n"],
          ])

          // These two reads are what makes Turbopack trace the WHOLE project
          // into every function (see the build warnings) — the output nearly
          // blows the 250 MB function limit. Opt them out, and scope the two
          // files they need to the og routes in next.config.mjs below.
          patchFile('apps/web/src/lib/og-image.server.ts', [
            [
              "readFile(findPackageFile('@resvg/resvg-wasm', 'index_bg.wasm'))",
              "readFile(/*turbopackIgnore: true*/ findPackageFile('@resvg/resvg-wasm', 'index_bg.wasm'))",
            ],
            [
              "fallbackFont ??= readFile(\n    findPackageFile('next', 'dist/compiled/@vercel/og/Geist-Regular.ttf'),\n  )",
              "fallbackFont ??= readFile(\n    /*turbopackIgnore: true*/ findPackageFile('next', 'dist/compiled/@vercel/og/Geist-Regular.ttf'),\n  )",
            ],
          ])

          patchFile('apps/web/next.config.mjs', [
            // Vercel builds its own function output; standalone only doubles it.
            ["  output: 'standalone',\n", ''],

            // Replace the '/**/*' includes (shiki closure + og files on EVERY
            // function) with og files on the og routes only.
            [
              / {2}outputFileTracingIncludes: \{[\s\S]*?\n {2}\},\n/,
              "  outputFileTracingIncludes: {\n" +
              "    '/og/**': [...ogTraceConfig.outputFileTracingIncludes],\n" +
              "    '/[locale]/og/**': [...ogTraceConfig.outputFileTracingIncludes],\n" +
              "    '/home-og': [...ogTraceConfig.outputFileTracingIncludes],\n" +
              "  },\n",
            ],

            // mx-core throttles at 100 req / 10s / IP; 8-way prerender of 104
            // pages trips it and aborts the export.
            [
              'experimental: {',
              [
                'experimental: {',
                '    staticGenerationMaxConcurrency: 1,',
                '    staticGenerationRetryCount: 5,',
              ].join('\n'),
            ],

            // HEAD is the empty "Deploy with Vercel" commit, so take the real
            // sha from the build env instead of Vercel's git metadata.
            [
              'function getRepoInfo() {',
              [
                'function getRepoInfo() {',
                '  if (process.env.BUILD_COMMIT_SHA) {',
                '    const sha = process.env.BUILD_COMMIT_SHA',
                "    return { hash: sha, url: 'https://github.com/innei-dev/Yohaku/commit/' + sha }",
                '  }',
              ].join('\n'),
            ],
          ])
          EOF

      - name: Configure Git
        run: |
          echo "REAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit --allow-empty -m "Deploy with Vercel" || true

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel

          # Hash of the real source commit, not the empty deploy commit —
          # the prepare job compares this against the source repo's HEAD.
          sha_short=$(git rev-parse --short $REAL_SHA)
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

          # Let Vercel handle the build
          deployment_url=$(vercel deploy --token=$VERCEL_TOKEN --prod \
            --build-env BUILD_COMMIT_SHA=$REAL_SHA 2>&1 \
            | tee /tmp/vercel-output.txt | grep -E "https://.*vercel.app" | head -1)

          if [ -z "$deployment_url" ]; then
            echo "Trying alternative URL extraction..."
            deployment_url=$(cat /tmp/vercel-output.txt | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -1)
          fi

          if [ -z "$deployment_url" ]; then
            echo "Error: Could not extract deployment URL"
            echo "Full output:"
            cat /tmp/vercel-output.txt
            exit 1
          fi

          echo "preview-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment successful: $deployment_url"

      # The og routes read their wasm/font at runtime, so a wrong tracing
      # config fails here and nowhere else — the build stays green.
      - name: Smoke test og image
        run: |
          url="${{ steps.deploy.outputs.preview-url }}/home-og?lang=en"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            200) echo "✅ og smoke test passed" ;;
            401|403) echo "⚠️ og smoke test skipped (deployment protected: $code)" ;;
            *) echo "❌ og smoke test failed: $code ($url)"; exit 1 ;;
          esac

      - name: Log deployment URL
        run: |
          echo "✅ Production deployment successful: ${{ steps.deploy.outputs.preview-url }}"

      - name: Checkout deployment repository
        if: success()
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update hash file
        if: success()
        run: |
          echo "${{ steps.deploy.outputs.sha_short }}" > ${{ env.HASH_FILE }}

      - name: Commit hash file
        if: success()
        run: |
          git add ${{ env.HASH_FILE }}
          git commit -m "Update hash file" || true
          git push || true
